services:
  - type: web
    name: itis-enterprise-web
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_NODE_ENV
        value: production
      - key: VITE_PRIMARY_DOMAIN
        value: https://itis.co.za
      - key: VITE_GOV_DOMAIN
        value: https://itis.gov.za

  - type: web
    name: itis-backend-api
    env: node
    plan: starter
    buildCommand: npm ci
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - fromDatabase:
          name: itis-postgres-db
          property: connectionString

databases:
  - name: itis-postgres-db
    databaseName: itis_prod
    user: itis_admin
    plan: starter
