# HashiCorp Vault Secrets Injector Policy & ExternalSecret Integration

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: itis-production
spec:
  provider:
    vault:
      server: "https://vault.govcloud.sita.co.za:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "itis-app-role"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: itis-vault-secrets
  namespace: itis-production
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: itis-vault-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: production/database
        property: url
    - secretKey: SAPS_CLIENT_SECRET
      remoteRef:
        key: production/saps
        property: client_secret
    - secretKey: SITA_CLIENT_SECRET
      remoteRef:
        key: production/sita
        property: client_secret
