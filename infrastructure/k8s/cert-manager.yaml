# Cert-Manager ClusterIssuers for Automated SSL/TLS Certificates
# Supports Let's Encrypt ACME and SITA Government Enterprise PKI Certification Authority.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: secops@itis.gov.za
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
      - dns01:
          route53:
            region: af-south-1
            hostedZoneID: Z10091823ZAITIS
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sita-pki-enterprise-issuer
spec:
  ca:
    secretName: sita-govcloud-ca-root-secret
