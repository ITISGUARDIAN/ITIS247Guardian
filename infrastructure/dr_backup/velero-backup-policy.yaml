# Velero Kubernetes Backup & Disaster Recovery Schedule Policy
# Enforces 15-Minute RPO (Recovery Point Objective) & 10-Minute RTO (Recovery Time Objective)
# Backs up Kubernetes Namespaces, Persistent Volumes, Vault Certificates, and Database Snapshots.

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: itis-prod-hourly-backup
  namespace: velero
spec:
  schedule: "*/15 * * * *" # Every 15 minutes
  template:
    includedNamespaces:
      - itis-production
      - cert-manager
      - external-secrets
    storageLocation: sita-sovereign-object-storage
    volumeSnapshotLocations:
      - sita-jhb-ceph-snapshots
    ttl: 720h0m0s # 30 Days Retention
    hooks:
      resources:
        - name: pre-db-snapshot-flush
          includedNamespaces:
            - itis-production
          exec:
            container: itis-node-server
            command:
              - /bin/sh
              - -c
              - "echo 'FLUSH TABLES WITH READ LOCK;' | psql $DATABASE_URL"
            onError: Fail
            timeout: 30s
